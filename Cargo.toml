[package]
name = "libxc_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# Phase 10: thin facade — deps reduced to the 3 leaf crates. bitflags/bytemuck/
# cubecl/thiserror are no longer direct root deps (they live in the leaf crates;
# api/ and the facade re-exports use none of them directly).
libxc-core   = { path = "crates/libxc-core" }
libxc-eval   = { path = "crates/libxc-eval", default-features = false }
libxc-compat = { path = "crates/libxc-compat", default-features = false }


[features]
# Phase 10 (D-10): the per-functional kernel feature machinery moved to libxc-eval.
# Root re-forwards the family features; the libxc-eval dep is pinned
# default-features=false (Pitfall 1) so no-feature builds do NOT pull all 306
# kernels (OOM). verify activates a family via libxc_rs/oracle-<fam>.
# Off by default since ADR 0001 -- see crates/libxc-compat/Cargo.toml. `verify`
# activates a family explicitly via libxc_rs/oracle-<fam>.
default     = []
cubecl-backend = ["libxc-eval/cubecl-backend"]
oracle-lda  = ["libxc-eval/oracle-lda"]
oracle-gga  = ["libxc-eval/oracle-gga"]
oracle-mgga = ["libxc-eval/oracle-mgga"]
[dev-dependencies]
approx = "0.5.1"
libm = "0.2"
libxc_rs-verify = { path = "verify" }

[workspace]
resolver = "3"

# Hand-written crates only. The two generated kernel trees (305 rayon crates,
# 306 archived CubeCL crates) are deliberately NOT members -- see `exclude`.
members = [
    # --- core library ---------------------------------------------------
    "crates/libxc-core",
    "crates/libxc-compat",

    # --- rayon backend (current) ----------------------------------------
    "crates/libxc-reval",
    "crates/kernels-rayon/math",

    # --- CubeCL backend (archived, ADR 0001) ----------------------------
    "crates/libxc-eval",

    # --- tooling / harnesses --------------------------------------------
    "xtask",
    "libxc-sys",
]

# The generated kernel trees are excluded from the workspace, not merely kept
# out of `default-members`.
#
# `default-members` only changes what a bare `cargo build` picks. It does not
# affect `cargo check --workspace`, which is what rust-analyzer (Zed, VS Code)
# runs -- with 611 generated crates as members that meant ~900 units checked
# and every one of them indexed as workspace code on each editor session.
#
# Excluding them makes them ordinary path dependencies: still built when
# something depends on them, but not enumerated by `--workspace` and not
# indexed by rust-analyzer.
#
# Consequences to know about:
#   * `cargo check -p libxc-rkernel-<f>` still works for any kernel reachable
#     from a member (libxc-reval depends on 156 of them; libxc-eval on all 306
#     archived ones under its oracle-* features).
#   * For a kernel that nothing depends on, use
#     `cargo check --manifest-path crates/kernels-rayon/<fam>/<f>/Cargo.toml`.
exclude = [
    "archive",
    # On-demand verification tools. Both link the archived CubeCL backend by
    # design -- kernels-rayon/verify is the bit-exactness gate that compares the
    # two trees -- so keeping them as members put cubecl and its ~235
    # transitive crates into every `cargo check --workspace`. Run them with
    # --manifest-path:
    #   cargo run --release --manifest-path crates/kernels-rayon/verify/Cargo.toml
    #   cargo test --manifest-path verify/Cargo.toml --features oracle-gga --jobs 1
    #   cargo test --manifest-path verify-canary/Cargo.toml
    #
    # `verify` belongs here even though its normal deps are light: it carries 17
    # archived kernel crates as *dev-dependencies*, which `cargo check
    # --all-targets` builds. `cargo tree -e normal` hides those, which is why an
    # earlier measurement of this looked clean when it was not.
    "crates/kernels-rayon/verify",
    "verify",
    "verify-canary",
    "crates/kernels-rayon/lda",
    "crates/kernels-rayon/gga",
    "crates/kernels-rayon/mgga",
]

# A bare `cargo build` builds the active library only.
default-members = [
    "crates/libxc-core",
    "crates/libxc-compat",
    "crates/libxc-reval",
    "crates/kernels-rayon/math",
]
# Reduce peak memory: CubeCL proc macro expansion generates massive IR.
# debug=0 skips LLVM debug scope tracking.
# codegen-units=4 bounds per-unit memory.
# incremental=false so sccache can cache compiled crates.
[profile.dev]
debug = 0
codegen-units = 2
incremental = false

# Optimize proc-macros (and their build-dep tree) once at -O3 so each
# expansion call runs ~5-10x faster. cubecl-macros + syn/quote run thousands
# of times during a workspace build; the one-time cost of optimizing the
# macro crate is repaid many times over. Does not touch the main compilation.
[profile.dev.build-override]
opt-level = 3
codegen-units = 2
debug = false

[profile.release]
debug = 0
incremental = false
codegen-units = 2

[profile.release.build-override]
opt-level = 3
codegen-units = 2
debug = false

[profile.test]
debug = 0
codegen-units = 2
incremental = false

[profile.test.build-override]
opt-level = 3
codegen-units = 2
debug = false
