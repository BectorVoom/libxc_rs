[package]
name = "libxc_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.10.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
cubecl = { version = "0.10.0", default-features = false, features = ["cpu"] }
thiserror = "2.0.18"
libxc-kernel-math = { path = "crates/kernels/math" }
libxc-kernel-lda = { path = "crates/kernels/lda" }
libxc-kernel-lda-1 = { path = "crates/kernels/lda-1" }
libxc-kernel-gga = { path = "crates/kernels/gga" }
libxc-kernel-mgga = { path = "crates/kernels/mgga" }

libxc-kernel-mgga-1 = { path = "crates/kernels/mgga-1" }
libxc-kernel-mgga-2 = { path = "crates/kernels/mgga-2" }
libxc-kernel-mgga-3 = { path = "crates/kernels/mgga-3" }
libxc-kernel-mgga-4 = { path = "crates/kernels/mgga-4" }
libxc-kernel-mgga-5 = { path = "crates/kernels/mgga-5" }
libxc-kernel-mgga-6 = { path = "crates/kernels/mgga-6" }
libxc-kernel-mgga-7 = { path = "crates/kernels/mgga-7" }
libxc-kernel-mgga-8 = { path = "crates/kernels/mgga-8" }
[dev-dependencies]
approx = "0.5.1"
libm = "0.2"
libxc_rs-verify = { path = "verify" }

[workspace]
members=[    "xtask",
    "verify",
    "libxc-sys",]
default-members = [
    "crates/kernels/math",
    "crates/kernels/lda",
    "crates/kernels/lda-1",
    "crates/kernels/gga",
    "crates/kernels/gga-1",
    "crates/kernels/gga-2",
    "crates/kernels/gga-3",
    "crates/kernels/gga-4",
    "crates/kernels/gga-5",
    "crates/kernels/mgga",
    "crates/kernels/mgga-1",
    "crates/kernels/mgga-2",
    "crates/kernels/mgga-3",
    "crates/kernels/mgga-4",
    "crates/kernels/mgga-5",
    "crates/kernels/mgga-6",
    "crates/kernels/mgga-7",
    "crates/kernels/mgga-8",
]
resolver = "3"
# Reduce peak memory: CubeCL proc macro expansion generates massive IR.
# debug=0 skips LLVM debug scope tracking.
# codegen-units=16 bounds per-unit memory.
# incremental=false so sccache can cache compiled crates.
[profile.dev]
debug = 0
codegen-units = 16
incremental = false

# Optimize proc-macros (and their build-dep tree) once at -O3 so each
# expansion call runs ~5-10x faster. cubecl-macros + syn/quote run thousands
# of times during a workspace build; the one-time cost of optimizing the
# macro crate is repaid many times over. Does not touch the main compilation.
[profile.dev.build-override]
opt-level = 3
codegen-units = 256
debug = false

[profile.release]
debug = 0
incremental = false
codegen-units = 256

[profile.release.build-override]
opt-level = 3
codegen-units = 256
debug = false

[profile.test]
debug = 0
codegen-units = 16
incremental = false

[profile.test.build-override]
opt-level = 3
codegen-units = 256
debug = false
