[package]
name = "libxc_rs"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust reimplementation of the libxc 7.0.0 exchange-correlation functional library for density functional theory"
license = "MIT"
readme = "README.md"
repository = "https://github.com/BectorVoom/libxc_rs"
keywords = ["dft", "chemistry", "physics", "libxc", "quantum"]
categories = ["science", "mathematics"]

# **Allowlist, not a denylist.** The package directory *is* the repository
# root, so anything not named here would otherwise be shipped: 372 MB of
# vendored C in `libxc-master/` (the oracle, which is a verification tool and
# not part of the production path at all), the `bench-vs-libxc` harness, the
# `verify/` suite, and 22,654 Windows `:Zone.Identifier` files whose names
# `cargo package` outright refuses ("cannot package a filename with a special
# character `:`"). A denylist would have to be kept in step with every new
# directory; this cannot silently grow.
#
# `src/model` is deliberately absent: it is a symlink to
# `crates/libxc-core/src/model` that the regeneration tools want on disk, and
# nothing in this crate compiles it -- `lib.rs` re-exports `libxc_core::model`.
# Packaging a symlink that escapes the package root is at best unportable.
include = [
    "/src/lib.rs",
    "/src/api",
    "/README.md",
    "/LICENSE",
]

[dependencies]
# Phase 10: thin facade — deps reduced to the 3 leaf crates. bitflags/bytemuck/
# cubecl/thiserror are no longer direct root deps (they live in the leaf crates;
# api/ and the facade re-exports use none of them directly).
libxc-core   = { path = "crates/libxc-core" }
libxc-eval   = { path = "crates/libxc-eval", default-features = false }
libxc-compat = { path = "crates/libxc-compat", default-features = false }
libxc-reval  = { path = "crates/libxc-reval" }



[features]
# The `oracle-{lda,gga,mgga}` and `cubecl-backend` features are gone with the
# archived CubeCL tree they selected. Numerical work is `libxc-reval` and the
# generated kernels in `crates/kernels-rayon`, neither of which is optional.
default     = []
c-abi       = ["libxc-compat/c-abi"]
[dev-dependencies]
approx = "0.5.1"
libm = "0.2"
# `libxc_rs-verify` is deliberately NOT a dev-dependency of this crate, even
# though cargo would strip a path-only dev-dep at publish time. It pulls in
# `libxc-sys`, which builds the vendored C libxc through cmake -- roughly an
# hour, dominated by `mgga_x_br89.c` -- so a plain `cargo test` on the library
# would compile a 372 MB C project it never links. The tests that do need the
# oracle live in `verify/tests/`, with the other 17 oracle files; see the
# Verification section of AGENTS.md for how to run them.

[workspace]
resolver = "3"

# Hand-written crates only. The generated kernel tree (266 crates) is
# deliberately NOT a member -- see `exclude`.
members = [
    ".",
    # --- core library ---------------------------------------------------
    "crates/libxc-core",
    "crates/libxc-compat",

    # --- rayon backend (current) ----------------------------------------
    "crates/libxc-reval",
    "crates/kernels-rayon/math",

    # --- orchestration types the facade and C-ABI still take ------------
    "crates/libxc-eval",

    # --- tooling / harnesses --------------------------------------------
    "xtask",
    # `libxc-sys` is NOT a member: see `exclude`.
    # Head-to-head speed/memory benchmark against C libxc. A member (not an
    # excluded harness) so it shares the workspace lockfile and profiles --
    # the numbers are meaningless if it resolves rayon or the kernels
    # differently from the library it is measuring.
    "bench-vs-libxc",
]

# The generated kernel trees are excluded from the workspace, not merely kept
# out of `default-members`.
#
# `default-members` only changes what a bare `cargo build` picks. It does not
# affect `cargo check --workspace`, which is what rust-analyzer (Zed, VS Code)
# runs -- with the generated crates as members that meant hundreds of extra
# units checked and indexed as workspace code on each editor session.
#
# Excluding them makes them ordinary path dependencies: still built when
# something depends on them, but not enumerated by `--workspace` and not
# indexed by rust-analyzer.
#
# Consequences to know about:
#   * `cargo check -p libxc-rkernel-<f>` still works for any kernel reachable
#     from a member (libxc-reval depends on 156 of them).
#   * For a kernel that nothing depends on, use
#     `cargo check --manifest-path crates/kernels-rayon/<fam>/<f>/Cargo.toml`.
exclude = [
    # The C oracle. Listed here for intent, but be aware of the limit: cargo
    # pulls a path dependency of a member into the workspace whether or not it
    # is excluded, and `bench-vs-libxc` and `xtask` both declare it (optionally).
    # So `cargo metadata` still reports it as a member and `cargo check
    # --workspace` still checks it -- which on a clean tree means running cmake
    # over the 372 MB vendored `libxc-master/`, roughly an hour.
    #
    # What the `libxc-oracle` features *do* buy, measured: `cargo build`,
    # `cargo test`, `cargo check -p bench-vs-libxc`, and simd_qualify.py's
    # `xcqual` build no longer touch it at all.
    #
    # Getting it out of `--workspace` too would mean moving `bench-vs-libxc`
    # and `xtask` to `exclude` as well, and that trade is worse than it looks:
    # they would stop sharing the workspace lockfile, which is exactly how
    # `verify/Cargo.lock` silently drifted to `wide` 1.7.0 against the
    # library's 1.6.1. A benchmark resolving a different SIMD crate than the
    # library it measures is not a benchmark.
    "libxc-sys",

    # On-demand verification tools, kept out of `cargo check --workspace`. Run
    # them with --manifest-path:
    #   cargo test --release --manifest-path crates/kernels-rayon/oracle/Cargo.toml
    #   cargo test --manifest-path verify/Cargo.toml --features oracle-gga --jobs 1
    #   cargo test --manifest-path verify-canary/Cargo.toml
    #
    # `verify` belongs here even though its normal deps are light: it carries 17
    # archived kernel crates as *dev-dependencies*, which `cargo check
    # --all-targets` builds. `cargo tree -e normal` hides those, which is why an
    # earlier measurement of this looked clean when it was not.
    "crates/kernels-rayon/oracle",
    "verify",
    "verify-canary",
    "crates/kernels-rayon/lda",
    "crates/kernels-rayon/gga",
    "crates/kernels-rayon/mgga",
]

# A bare `cargo build` builds the active library only.
default-members = [
    ".",
    "crates/libxc-core",
    "crates/libxc-compat",
    "crates/libxc-reval",
    "crates/kernels-rayon/math",
]
# Build cost note: cold release build of the kernel tree is >40 min; debug builds take minutes.
# debug=0 skips LLVM debug scope tracking.
# incremental=false so sccache can cache compiled crates.
#
# codegen-units=16 (was 2, a CubeCL-era memory guard): the rayon kernel crates
# are plain straight-line f64 code whose build time is almost entirely LLVM
# codegen, which parallelises across units — mgga_c_kcis release drops 5m13s
# -> 1m27s wall at CGU=16 with jobs>=8, with peak RSS flat (~2.2 GB, set by
# the front end, not the backend). Runtime is unaffected (measured ns/pt and
# checksums identical at CGU=2 vs 16): kernels never need cross-unit inlining
# — math helpers are #[inline(always)] and crate-local ThinLTO still runs
# across a crate's own units. Front-end memory of monster crates is unchanged
# by this knob.
[profile.dev]
debug = 0
codegen-units = 16
incremental = false

# Optimize proc-macros (and their build-dep tree) once at -O3 so each
# expansion call runs ~5-10x faster. cubecl-macros + syn/quote run thousands
# of times during a workspace build; the one-time cost of optimizing the
# macro crate is repaid many times over. Does not touch the main compilation.
[profile.dev.build-override]
opt-level = 3
codegen-units = 2
debug = false

[profile.release]
debug = 0
incremental = false
codegen-units = 16

[profile.release.build-override]
opt-level = 3
codegen-units = 2
debug = false

[profile.test]
debug = 0
codegen-units = 16
incremental = false

[profile.test.build-override]
opt-level = 3
codegen-units = 2
debug = false
