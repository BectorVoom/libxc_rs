[package]
name = "libxc_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.10.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
cubecl = { version = "0.10.0", default-features = false, features = ["cpu"] }
thiserror = "2.0.18"
libxc-core = { path = "crates/libxc-core" }
libxc-eval = { path = "crates/libxc-eval", default-features = false }


[features]
# Phase 10 (D-10): the per-functional kernel feature machinery moved to libxc-eval.
# Root re-forwards the family features; the libxc-eval dep is pinned
# default-features=false (Pitfall 1) so no-feature builds do NOT pull all 306
# kernels (OOM). verify activates a family via libxc_rs/oracle-<fam>.
default     = ["oracle-lda", "oracle-gga", "oracle-mgga"]
oracle-lda  = ["libxc-eval/oracle-lda"]
oracle-gga  = ["libxc-eval/oracle-gga"]
oracle-mgga = ["libxc-eval/oracle-mgga"]
[dev-dependencies]
approx = "0.5.1"
libm = "0.2"
libxc_rs-verify = { path = "verify" }

[workspace]
members=[    "xtask",
    "verify",
    "verify-canary",
    "libxc-sys",
    "crates/libxc-core",
    "crates/libxc-eval",]
# default-members = crates/kernels/math + every per-functional subcrate EXCEPT
# the 7 D-11 deferred kernels (mgga_c_b94, mgga_x_br89, mgga_x_mbr,
# mgga_x_mbrxc_bg, mgga_x_mbrxh_bg, mgga_x_mggac, mgga_x_br89_explicit). Those
# stay workspace members via the [dependencies] path-deps above, so
# `cargo build -p` builds them on demand, but a bare `cargo build` skips them.
default-members = [
    "crates/kernels/math",
