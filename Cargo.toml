[package]
name = "libxc_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.10.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
cubecl = { version = "0.9.0", default-features = false, features = ["cpu"] }
thiserror = "2.0.18"

[dev-dependencies]
approx = "0.5.1"
libm = "0.2"

[workspace]
members = ["xtask","verify","tools/gga_test_crate"]

# Reduce peak memory: CubeCL proc macro expansion for 127 GGA kernel modules
# generates massive IR. Disabling debug info avoids LLVM's debug scope tracking
# which is the primary memory consumer for deeply nested generated code.
[profile.dev.package.libxc_rs]
debug = 0
codegen-units = 16

[profile.test.package.libxc_rs]
debug = 0
codegen-units = 16
