resolver = "3"
# Reduce peak memory: CubeCL proc macro expansion generates massive IR.
# debug=0 skips LLVM debug scope tracking.
# codegen-units=4 bounds per-unit memory.
# incremental=false so sccache can cache compiled crates.
[profile.dev]
debug = 0
codegen-units = 2
incremental = false

# Optimize proc-macros (and their build-dep tree) once at -O3 so each
# expansion call runs ~5-10x faster. cubecl-macros + syn/quote run thousands
# of times during a workspace build; the one-time cost of optimizing the
# macro crate is repaid many times over. Does not touch the main compilation.
[profile.dev.build-override]
opt-level = 3
codegen-units = 2
debug = false

[profile.release]
debug = 0
incremental = false
codegen-units = 2

[profile.release.build-override]
opt-level = 3
codegen-units = 2
debug = false

[profile.test]
debug = 0
codegen-units = 2
incremental = false

[profile.test.build-override]
opt-level = 3
codegen-units = 2
debug = false
