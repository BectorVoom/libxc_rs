[package]
name = "libxc-kernel-math"
version = "0.1.0"
edition = "2024"

[dependencies]
cubecl = { version = "0.9.0", default-features = false, features = ["cpu"] }

[dev-dependencies]
approx = "0.5.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
libm = "0.2"

[profile.dev]
debug = 0
codegen-units = 16

[profile.test]
debug = 0
codegen-units = 16
