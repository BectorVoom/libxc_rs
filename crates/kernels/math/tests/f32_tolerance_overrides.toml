# F32 tolerance overrides for D-19c per-test relaxation.
# Loaded by verify/tests/parity_phase11.rs::f32_tolerance_for(name) and (in future
# phases) by verify/tests/oracle_*.rs.
#
# Default tolerance when no override applies: 1e-6 (D-19a RELAXED_TOL_F32 base).
# Hard ceiling: 1e-3 — any per-test entry exceeding 1e-3 HALTs the plan and
# triggers discuss-phase (indicates an f32 codegen defect, not convergence noise).
#
# Rationale per CONTEXT.md D-19c: Brent root-finder helpers (br89.rs, mbrxc.rs)
# and similar iterative algorithms may need relaxation beyond 1e-6 due to f32
# convergence behavior — the iteration count and step refinement are dependent
# on machine epsilon, which is ~6 orders of magnitude looser at f32.

[default]
tolerance = 1e-6

# Brent-class helpers
[mgga_c_b94]
tolerance = 1e-4
rationale = "Brent root-finder via br89/bessel helpers; D-08 stack-sensitive"

[mgga_x_br89]
tolerance = 1e-4
rationale = "Brent root-finder (direct)"

[mgga_x_br89_explicit]
tolerance = 1e-4
rationale = "Brent root-finder (explicit form)"

[mgga_x_mbr]
tolerance = 1e-4
rationale = "Modified Brent"

[mgga_x_mbrxc_bg]
tolerance = 1e-4
rationale = "Modified Brent with background"

[mgga_x_mbrxh_bg]
tolerance = 1e-4
rationale = "Modified Brent with hybrid background"

[mgga_x_mggac]
tolerance = 1e-4
rationale = "MGGAC variant — depends on br89-family helpers"
