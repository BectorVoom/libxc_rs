[package]
name = "libxc-kernel-mgga"
version = "0.1.0"
edition = "2024"

[features]
# Forwards the per-sub-crate `deferred-kernels` flag for kernels whose libxc
# IDs are gated as "deferred" at runtime. Currently scoped to mgga-2 (the
# `mgga_c_b94` module) — see quick task 260514-q02. Extend to mgga-3/5/7/13/14
# in follow-up work when the remaining 5 deferred modules are gated.
deferred-kernels = ["libxc-kernel-mgga-2/deferred-kernels"]

[dependencies]
cubecl = { version = "0.10.0", default-features = false, features = ["cpu"] }
libxc-kernel-math = { path = "../math" }
libxc-kernel-mgga-1 = { path = "../mgga-1" }
libxc-kernel-mgga-2 = { path = "../mgga-2" }
libxc-kernel-mgga-3 = { path = "../mgga-3" }
libxc-kernel-mgga-4 = { path = "../mgga-4" }
libxc-kernel-mgga-5 = { path = "../mgga-5" }
libxc-kernel-mgga-6 = { path = "../mgga-6" }
libxc-kernel-mgga-7 = { path = "../mgga-7" }
libxc-kernel-mgga-8a = { path = "../mgga-8a" }
libxc-kernel-mgga-8b = { path = "../mgga-8b" }
libxc-kernel-mgga-9a = { path = "../mgga-9a" }
libxc-kernel-mgga-9b = { path = "../mgga-9b" }
libxc-kernel-mgga-10 = { path = "../mgga-10" }
libxc-kernel-mgga-11a = { path = "../mgga-11a" }
libxc-kernel-mgga-11b = { path = "../mgga-11b" }
libxc-kernel-mgga-12 = { path = "../mgga-12" }
libxc-kernel-mgga-13 = { path = "../mgga-13" }
libxc-kernel-mgga-14 = { path = "../mgga-14" }
