[package]
name = "libxc-compat"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# `cbrt_glibc`: the exported AK13 helper must reproduce C libxc's `CBRT`,
# which is glibc's cbrt -- not Rust's `f64::cbrt` (core-math).
libxc-rkernel-math = { path = "../kernels-rayon/math" }
libxc-core = { path = "../libxc-core" }
libxc-eval = { path = "../libxc-eval", default-features = false }
libxc-reval = { path = "../libxc-reval" }

[features]
default = []
c-abi = []
