[package]
name = "libxc-eval"
version = "0.1.0"
edition = "2024"

[dependencies]
libxc-core = { path = "../libxc-core" }
libxc-reval = { path = "../libxc-reval" }
bytemuck = { version = "1.25.0", features = ["derive"] }

[dev-dependencies]
# Only to size the leaf-pool assertion in `eval::mix` tests by the worker
# count; the crate itself reaches rayon through `libxc-reval`.
rayon = "1.11"

[features]
# No features. The CubeCL backend and its 306 archived kernel crates were
# deleted; what remains here is the cubecl-free orchestration the facade and
# the C-ABI still take `Functional` and `EvaluationWorkspace` from.
default = []
