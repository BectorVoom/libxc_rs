[package]
name = "libxc_rs-verify-canary"
version = "0.1.0"
edition = "2024"

# Phase 11.1 Plan 03 G3 canary — a STANDALONE parity test for the single
# `mgga_c_b94` functional that does NOT depend on the `libxc_rs` umbrella crate.
#
# Rationale (see .planning memory project_g3_b94_hollow_gate):
#   `verify/` depends on `libxc_rs = { path = ".." }`, whose 281 unconditional
#   kernel deps force ALL kernels to compile for ANY verify test. The original
#   G3 routed `mgga_c_b94` through `libxc_rs::eval::dispatch_mgga`, but b94 is
#   deferred + UNROUTED (no dispatch arm) and the entry hard-coded the wrong id
#   (568 vs real 397), so it silently SKIPPED — a hollow gate that still cost a
#   full 281-kernel build. This crate calls the kernel directly, building ONE
#   kernel, and actually evaluates parity vs the libxc id=397 oracle at 1e-12.
#
# NOT a workspace default-member: built on demand via
#   `cargo test -p libxc_rs-verify-canary`.

[dependencies]
cubecl = { version = "0.10.0", default-features = false, features = ["cpu"] }
bytemuck = "1.25"
libxc-kernel-mgga_c_b94 = { path = "../crates/kernels/mgga/mgga_c_b94" }
# Phase 12 single-kernel parity canaries — one kernel each, memory-safe at jobs=1.
libxc-kernel-mgga_x_th = { path = "../crates/kernels/mgga/mgga_x_th" }
libxc-kernel-mgga_x_2d_js17 = { path = "../crates/kernels/mgga/mgga_x_2d_js17" }
libxc-kernel-mgga_c_cs = { path = "../crates/kernels/mgga/mgga_c_cs" }
libxc-kernel-mgga_x_pkzb = { path = "../crates/kernels/mgga/mgga_x_pkzb" }
libxc-kernel-mgga_x_pbe_gx = { path = "../crates/kernels/mgga/mgga_x_pbe_gx" }
libxc-kernel-mgga_x_tm = { path = "../crates/kernels/mgga/mgga_x_tm" }
# Phase 12 12-04 regression guard: a non-NEEDS_TAU functional (kinetic, laplacian-only)
# that must NOT receive the sigma-down clamp (D-01 NEEDS_TAU gating fix).
libxc-kernel-mgga_k_gea2 = { path = "../crates/kernels/mgga/mgga_k_gea2" }
libxc-sys = { path = "../libxc-sys" }
