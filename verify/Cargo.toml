[package]
name = "libxc_rs-verify"
version = "0.1.0"
edition = "2024"
# Verification / tooling harness: never publishable.
publish = false

# Standalone: this harness is in the root `workspace.exclude` list, and since
# nothing in the workspace depends on it any more (the root crate's dev-dep on
# it was dropped so `cargo test` on the library stops building 372 MB of C),
# cargo needs to be told explicitly that it is its own workspace root.
[workspace]

# Mirror the root workspace's profiles *exactly*.
#
# This harness is its own workspace root (it is in the root `exclude` list, and
# since the root crate's dev-dependency on it was dropped nothing in the
# workspace pulls it back in), and a standalone workspace gets cargo's default
# profiles rather than the ones next door. That is not cosmetic: profile flags
# go into every unit's fingerprint, so one differing knob makes all 266 kernel
# crates miss the shared target directory and rebuild from scratch -- measured,
# on the first run after `verify` became standalone.
#
# `.cargo/config.toml` at the repo root still supplies `-C target-cpu=native`
# either way: rustflags are read from the invocation's working directory
# upward, not from the workspace root.
[profile.dev]
debug = 0
codegen-units = 16
incremental = false

[profile.dev.build-override]
opt-level = 3
codegen-units = 2
debug = false

[profile.release]
debug = 0
incremental = false
codegen-units = 16

[profile.release.build-override]
opt-level = 3
codegen-units = 2
debug = false

[profile.test]
debug = 0
codegen-units = 16
incremental = false

[profile.test.build-override]
opt-level = 3
codegen-units = 2
debug = false

[dependencies]
anyhow = "1.0.100"
libxc-sys = { path = "../libxc-sys" }
# Phase 11 / 11-12 (G-2, Path A): default-features = false so a single-family
# verify build forwards only that family's umbrella feature -> resolves only
# that family's kernels (memory-safe; provable via `cargo tree -e no-dev`).
# default = all three preserves the prior full-umbrella verify build.
libxc_rs = { path = "..", default-features = false }

[features]
default = []
c-abi = ["libxc_rs/c-abi"]

# Dev-dep narrowing per Phase 11 D-05 (11-CONTEXT.md): verify/ must depend on
# INDIVIDUAL per-functional kernel subcrates, NEVER on umbrella/family kernel
# crates. Wave 0 deviation D1 (11-01-SUMMARY.md) showed that umbrella
# `libxc-kernel-{lda,mgga}` dev-deps OOM-killed the verify build before any
# test compiled, even on a trivial standalone test. The umbrella family crates
# were deleted by 11-03's D-10a clean-slate restructure; this manifest now
# lists only the per-functional kernels that `verify/tests/parity_phase11.rs`
# exercises (the union of `PHASE11_SMOKE` + `PHASE11_WORST_CASE`). Other parity
# tests (parity_phase09.rs, *_oracle.rs) route through `libxc_rs::eval::dispatch_*`
# or `libxc_rs::kernel::...` re-exports and so do NOT need direct kernel dev-deps.
[dev-dependencies]
approx = "0.5.1"
libxc-rkernel-math = { path = "../crates/kernels-rayon/math" }
libxc-reval = { path = "../crates/libxc-reval" }
toml = "0.8"

# PHASE11_SMOKE — 3 LDA + 3 GGA + 4 MGGA (D-05 narrowed witness; 11-04)

# PHASE11_WORST_CASE — 6 MGGA (Phase 11 plan 11-05 closes these; #[ignore]'d today)
# NOTE: parity_phase11.rs lists `mgga_xc_b97m_v` (id 254) — the on-disk
# package is `libxc-kernel-mgga_xc_b97mv` (no underscore between b97m and v).
